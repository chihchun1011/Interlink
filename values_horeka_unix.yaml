nodeName: interlink-hpc-node

interlink:
  enabled: true
  image: ghcr.io/interlink-hq/interlink/interlink:0.6.2-pre4
  socket: unix:///var/run/interlink.sock
  address: http://0.0.0.0
  port: "3000"
  pluginEndpoint:
    url: "http://192.108.47.241"  
    port: "4000"
  logging:
    verboseLogging: true

plugin:
  enabled: false  

virtualNode:
  image: ghcr.io/interlink-hq/interlink/virtual-kubelet-inttw:0.6.2-pre4
  resources:
    CPUs: 4
    memGiB: 16
    pods: 50
    accelerators:
      - resourceType: nvidia.com/gpu
        model: a100
        available: 3
  network:
    # Cluster network configuration
    serviceCIDR: "10.96.0.0/12"       
    podCIDRCluster: "10.244.0.0/24"   
    dnsServiceIP: "10.96.0.10"        
    keepaliveSecs: 25
    # Tunnel configuration
    enableTunnel: true
    tunnelImage: "ghcr.io/erebe/wstunnel:latest"
    wildcardDNS: "192.108.47.241.nip.io"
    wstunnelCommand: "curl -L https://github.com/erebe/wstunnel/releases/download/v10.4.4/wstunnel_10.4.4_linux_amd64.tar.gz -o wstunnel.tar.gz && tar -xzvf wstunnel.tar.gz && chmod +x wstunnel && ./wstunnel client --http-upgrade-path-prefix %s %s ws://%s:32279 &\n"