SidecarPort: "4000"
Socket: ""
SbatchPath: "/usr/bin/sbatch"
ScancelPath: "/usr/bin/scancel"
SqueuePath: "/usr/bin/squeue"
SinfoPath: "/usr/bin/sinfo"
CommandPrefix: ""
ImagePrefix: "docker://"
SingularityPath: "singularity"
ExportPodData: true
DataRootFolder: "jobs/"
Namespace: "vk"
Tsocks: false
TsocksPath: ""
TsocksLoginNode: ""
BashPath: /bin/bash
VerboseLogging: true
ErrorsOnlyLogging: false
EnableProbes: true

# UID (User ID) configuration - set the user ID for SLURM jobs
# RFC: https://github.com/interlink-hq/interlink-slurm-plugin/discussions/58
# DefaultUID: 1000                # Optional: Set a default UID for all jobs
#                                 # Can be overridden per-pod using spec.securityContext.runAsUser

# Flavor configuration - predefined sets of SLURM submission options
DefaultFlavor: "default"
Flavors:
  default:
    Name: "default"
    Description: "Standard CPU job (4 cores, 16GB RAM)"
    CPUDefault: 4
    MemoryDefault: "16G"
    SlurmFlags:
      - "--partition=cpuonly"
      - "--time=01:00:00"

  gpu-a100:
    Name: "gpu-a100"
    Description: "NVIDIA A100 GPU job"
    CPUDefault: 8
    MemoryDefault: "64G"
    # UID: 2000                   # Optional: Set a specific UID for this flavor
    SlurmFlags:
      - "--gres=gpu:1"
      - "--partition=accelerated"
      - "--time=02:00:00"
  
  dev-cpu:
    Name: "dev-cpu"
    Description: "Quick dev/test CPU job"
    CPUDefault: 2
    MemoryDefault: "4G"
    SlurmFlags:
      - "--partition=dev_cpuonly"
      - "--time=00:30:00"
  
  dev-gpu:
    Name: "dev-gpu"
    Description: "Quick GPU test on dev partition"
    CPUDefault: 2
    MemoryDefault: "8G"
    SlurmFlags:
      - "--partition=dev_accelerated"
      - "--gres=gpu:1"
      - "--time=00:30:00"
