nodeName: interlink-htcondor

interlink:
  enabled: true
  image: ghcr.io/interlink-hq/interlink/interlink:0.6.1-pre5
  address: http://0.0.0.0
  port: 3000
  pluginEndpoint:
    url: "http://192.108.47.241"
    port: "8080"
  logging:
    verboseLogging: true

plugin:
  enabled: false

virtualNode:
  image: ghcr.io/interlink-hq/interlink/virtual-kubelet-inttw:0.6.1-pre5
  resources:
    CPUs: 4
    memGiB: 16
    pods: 50
    accelerators:
      - resourceType: nvidia.com/gpu
        model: a100
        available: 3
  network:
    # Cluster network configuration
    serviceCIDR: "10.96.0.0/12"       
    podCIDRCluster: "10.244.0.0/24"   
    dnsServiceIP: "10.96.0.10"        
    keepaliveSecs: 25
    # Tunnel configuration
    enableTunnel: true
    tunnelImage: "ghcr.io/erebe/wstunnel:latest"
    wildcardDNS: "192.108.47.241.nip.io"
    